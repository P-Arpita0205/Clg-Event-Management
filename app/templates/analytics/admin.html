{% extends "dashboards/base_dashboard.html" %}
{% block title %}Analytics{% endblock %}
{% block page_title %}Analytics{% endblock %}
{% block dashboard_content %}
<div class="row g-4">
  <div class="col-lg-7">
    <article class="panel-card h-100">
      <div class="panel-header"><div><span class="panel-kicker">Events</span><h2>Events by category</h2></div></div>
      <div class="chart-container">
        <canvas id="categoryChart" data-labels='{{ category_labels | tojson }}' data-values='{{ category_counts | tojson }}'></canvas>
      </div>
    </article>
  </div>
  <div class="col-lg-5">
    <article class="panel-card h-100">
      <div class="panel-header"><div><span class="panel-kicker">Workflow</span><h2>Events by status</h2></div></div>
      <div class="chart-container">
        <canvas id="statusChart" data-labels='{{ status_labels | tojson }}' data-values='{{ status_counts | tojson }}'></canvas>
      </div>
    </article>
  </div>
</div>
{% endblock %}
