{% extends "base.html" %}
{% block title %}Event feedback{% endblock %}
{% block body %}
<main class="auth-page">
  <section class="auth-card auth-card-wide">
    <a class="auth-brand" href="{{ url_for('main.index') }}"><i class="fa-solid fa-graduation-cap"></i> Campus Connect</a>
    <h1>Share feedback</h1>
    <p class="text-secondary">{{ event.title }}</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Rating</label>
      <div class="d-flex gap-2 mb-3">
        {% for rating in range(1,6) %}
        <label class="btn btn-outline-warning">
          <input class="d-none" type="radio" name="rating" value="{{ rating }}" required>
          {{ rating }} <i class="fa-solid fa-star"></i>
        </label>
        {% endfor %}
      </div>
      <label class="form-label">Suggestions</label>
      <textarea class="form-control" name="suggestions" rows="5" maxlength="2000" placeholder="What could make the next event better?"></textarea>
      <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" name="is_anonymous" id="anonymous">
        <label class="form-check-label" for="anonymous">Submit anonymously</label>
      </div>
      <button class="btn btn-primary w-100 mt-4">Submit feedback</button>
    </form>
  </section>
</main>
{% endblock %}
