{% extends "base.html" %}
{% block title %}Server error | Campus Connect{% endblock %}
{% block body %}
<main class="error-page">
  <section class="auth-card text-center">
    <div class="error-code">5<span>0</span>0</div>
    <h1 class="mt-3 h3 fw-bold text-navy">Something went wrong</h1>
    <p class="text-secondary mb-4">An unexpected error occurred while processing your request. Please try again.</p>
    <a class="btn btn-primary" href="{{ url_for('main.index') }}"><i class="fa-solid fa-house me-2"></i>Return home</a>
  </section>
</main>
{% endblock %}
