{% extends "base.html" %}
{% block title %}QR attendance{% endblock %}
{% block body %}
<main class="auth-page">
  <section class="auth-card text-center">
    <i class="fa-solid {{ 'fa-circle-check text-success' if valid else 'fa-circle-xmark text-danger' }} fa-3x"></i>
    <h1 class="mt-3 h4">{{ message }}</h1>
    {% if student and event %}
    <p class="text-secondary mb-1"><strong>{{ student.full_name }}</strong></p>
    <p class="text-secondary">{{ event.title }}</p>
    {% endif %}
    {% if event %}
    <a class="btn btn-primary mt-2" href="{{ url_for('attendance.manage', event_id=event.id) }}">Back to attendance</a>
    {% endif %}
  </section>
</main>
{% endblock %}
